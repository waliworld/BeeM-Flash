<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wali Datalog — preview</title>
<style>
  html, body { margin: 0; background: #05080b; color: #cdd; font-family: Arial, sans-serif; }
  #wrap { padding: 16px; }
  canvas { display: block; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); background:#0b0f14; }
  .cap { margin: 10px 2px; font-size: 13px; color: #789; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="1600" height="520"></canvas>
  <div class="cap" id="cap">loading…</div>
</div>

<script src="app.bundle.js"></script>
<script src="cv2d.js"></script>
<script>
(function () {
  var canvas = document.getElementById('screen');
  var cv = window.makeCv2d(canvas, 1600, 520);
  var App = window.__ENTRY.App;

  function memStore() {
    var files = {};
    return {
      open: function (n) { files[n] = ''; return { name: n }; },
      append: function (h, t) { files[h.name] = (files[h.name] || '') + t; },
      close: function () {},
      size: function (h) { return (files[h.name] || '').length; },
      list: function () { return Object.keys(files); },
      read: function (n) { return files[n] || ''; },
      remove: function (n) { delete files[n]; },
      export: function (n, d) { return (d || 'usb') + '/' + n; }
    };
  }

  function makeApp(settings) {
    var s = Object.assign({ demo: 'on', source: 'auto', rate: 20, units: 'metric', autostart: false, mapcontrol: false }, settings || {});
    var ctx = {
      _noTimers: true,
      _storage: memStore(),
      internet: true,
      surface: function () { return cv; },
      settings: { get: function (k) { return s[k]; }, onChange: function () {} },
      ui: { onClick: function () {}, image: function () { return null; } },
      log: { info: function () {}, warn: function () {}, error: function () {} }
    };
    var app = new App();
    app.start(ctx);
    return app;
  }

  // Drive N demo ticks with a deterministic clock.
  function drive(app, frames, startMs) {
    var now = startMs || 1700000000000;
    app.engine.clock = function () { return now; };
    for (var i = 0; i < frames; i++) { now += 50; app.tick(now); }
    return now;
  }

  // Each case sets up an App, selects a tab, and renders one frame.
  function withEnet(app) {
    drive(app, 6);
    app.enet.acknowledge(); app.enet.setEnabled(true);
    app.enet.setVehicle({ vin: 'WBA00000000000001', host: '169.254.1.1', logicalAddress: 0x1000 });
    return app;
  }
  var SAMPLE_CODES = { scanned: 4, reached: 3, totalDtcs: 4, modules: [
    { module: { name: 'DME / DDE (engine)' }, ok: true, dtcs: [ { code: 'P0300', status: { confirmed: true } }, { code: 'P052A', status: { confirmed: false } } ] },
    { module: { name: 'EGS (transmission)' }, ok: true, dtcs: [ { code: 'P17BA', status: { confirmed: true } } ] },
    { module: { name: 'DSC (stability / brakes)' }, ok: true, dtcs: [ { code: 'C0501', status: { confirmed: true } } ] },
    { module: { name: 'EPS (steering)' }, ok: false, dtcs: [] } ] };
  var SAMPLE_DESC = { addressHex: '0xA0010000', size: 65536, security: 'level 0x11 + key', erase: 'routine 0xFF00', verify: 'routine 0xFF01' };

  window.renderScreen = function (name) {
    var app, cap = name;
    if (name === 'live') { app = makeApp({ style: 'tiles' }); drive(app, 210); app.tab = 'live'; app.render(cv); cap = 'LIVE — tiles'; }
    else if (name === 'live-bars') { app = makeApp({ style: 'bars' }); drive(app, 210); app.tab = 'live'; app.render(cv); cap = 'LIVE — bars'; }
    else if (name === 'live-dials') { app = makeApp({ style: 'dials' }); drive(app, 210); app.tab = 'live'; app.render(cv); cap = 'LIVE — dials'; }
    else if (name === 'log') {
      app = makeApp(); var now = 1700000000000; app.engine.clock = function () { return now; };
      app._startLog(); for (var i = 0; i < 140; i++) { now += 50; app.tick(now); if (i === 60) app.marker('pull-1'); } app._stopLog();
      app.tab = 'log'; app.render(cv); cap = 'LOG — session saved';
    }
    else if (name === 'log-rec') {
      app = makeApp(); var n2 = 1700000000000; app.engine.clock = function () { return n2; };
      app._startLog(); for (var j = 0; j < 90; j++) { n2 += 50; app.tick(n2); }
      app.tab = 'log'; app.render(cv); cap = 'LOG — recording';
    }
    else if (name === 'channels') { app = makeApp(); drive(app, 40); app.selection = 4; app.tab = 'channels'; app.render(cv); cap = 'CHANNELS'; }
    else if (name === 'maps-off') { app = makeApp({ mapcontrol: 'off' }); drive(app, 6); app.tab = 'maps'; app.render(cv); cap = 'MAPS — off (safe default)'; }
    else if (name === 'maps') { app = makeApp({ mapcontrol: 'armed' }); drive(app, 6); app.map.requested = 2; app.tab = 'maps'; app.render(cv); cap = 'MAPS — armed'; }
    else if (name === 'maps-confirm') { app = makeApp({ mapcontrol: 'armed' }); drive(app, 6); app.map.requested = 2; app.confirm = true; app.tab = 'maps'; app.render(cv); cap = 'MAPS — confirm'; }
    else if (name === 'connect') { app = withEnet(makeApp()); app.tab = 'connect'; app.render(cv); cap = 'CONNECT — connected (read-only)'; }
    else if (name === 'connect-locked') { app = makeApp(); drive(app, 6); app.tab = 'connect'; app.render(cv); cap = 'CONNECT — locked'; }
    else if (name === 'codes') { app = withEnet(makeApp()); app.codes.msg = ''; app.tab = 'codes'; app.render(cv); cap = 'CODES — before scan'; }
    else if (name === 'codes-result') { app = withEnet(makeApp()); app.codes.result = SAMPLE_CODES; app.codes.msg = '4 codes across 3/4 modules'; app.tab = 'codes'; app.render(cv); cap = 'CODES — scan result'; }
    else if (name === 'codes-confirm') { app = withEnet(makeApp()); app.codes.result = SAMPLE_CODES; app.codes.confirmClear = true; app.codes.msg = 'Press CLEAR again to ERASE fault memory.'; app.tab = 'codes'; app.render(cv); cap = 'CODES — clear confirm'; }
    else if (name === 'flash-off') { app = withEnet(makeApp()); app.flash.armed = false; app.tab = 'flash'; app.render(cv); cap = 'FLASH — engine OFF (safe)'; }
    else if (name === 'flash-ready') { app = withEnet(makeApp()); app.flash.armed = true; app.flash.descriptor = SAMPLE_DESC; app.tab = 'flash'; app.render(cv); cap = 'FLASH — calibration ready'; }
    else if (name === 'flash-confirm') { app = withEnet(makeApp()); app.flash.armed = true; app.flash.descriptor = SAMPLE_DESC; app.flash.confirm = true; app.tab = 'flash'; app.render(cv); cap = 'FLASH — confirm write'; }
    else if (name === 'flash-running') { app = withEnet(makeApp()); app.flash.armed = true; app.flash.descriptor = SAMPLE_DESC; app.flash.running = true; app.flash.progress = 62; app.flash.step = 'transfer 62%'; app.tab = 'flash'; app.render(cv); cap = 'FLASH — writing'; }
    else if (name === 'log-run') {
      app = makeApp(); var nr = 1700000000000; app.engine.clock = function () { return nr; };
      app._startLog(); for (var ri = 0; ri < 400; ri++) { nr += 50; app.tick(nr); } app._stopLog();
      app.tab = 'log'; app.render(cv); cap = 'LOG — with dyno pull estimate';
    }
    else if (name === 'info') {
      app = withEnet(makeApp());
      app.info.items = [
        { did: 0xF190, label: 'VIN', value: 'WBA12345678901234', ok: true },
        { did: 0xF187, label: 'Part number', value: '8795432', ok: true },
        { did: 0xF191, label: 'Hardware number', value: 'DME_MG1CS003', ok: true },
        { did: 0xF194, label: 'Software number', value: '00008051', ok: true },
        { did: 0xF195, label: 'Software version', value: 'I001-20', ok: true },
        { did: 0xF18C, label: 'ECU serial', value: 'not available', ok: false },
        { did: 0xF18B, label: 'Manufacturing date', value: '2021-04-18', ok: true },
        { did: 0xF17C, label: 'Calibration ID', value: 'CAL_B58_STG2', ok: true }
      ];
      app.info.msg = '7 of 10 identifiers read';
      app.tab = 'info'; app.render(cv); cap = 'INFO — ECU identification (read-only)';
    }
    else if (name === 'setup') { app = makeApp(); drive(app, 6); app.setupSel = 1; app.tab = 'setup'; app.render(cv); cap = 'SETUP — in-app settings'; }
    else { app = makeApp(); app.tab = 'live'; app.render(cv); }
    document.getElementById('cap').textContent = cap;
    return true;
  };

  window.PREVIEW_READY = true;
  window.renderScreen('live');
})();
</script>
</body>
</html>
