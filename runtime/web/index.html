<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wali Datalog — preview</title>
<style>
  html, body { margin: 0; background: #05080b; color: #cdd; font-family: Arial, sans-serif; }
  #wrap { padding: 16px; }
  canvas { display: block; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); background:#0b0f14; }
  .cap { margin: 10px 2px; font-size: 13px; color: #789; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="1600" height="520"></canvas>
  <div class="cap" id="cap">loading…</div>
</div>

<script src="app.bundle.js"></script>
<script src="cv2d.js"></script>
<script>
(function () {
  var canvas = document.getElementById('screen');
  var cv = window.makeCv2d(canvas, 1600, 520);
  var App = window.__ENTRY.App;

  function memStore() {
    var files = {};
    return {
      open: function (n) { files[n] = ''; return { name: n }; },
      append: function (h, t) { files[h.name] = (files[h.name] || '') + t; },
      close: function () {},
      size: function (h) { return (files[h.name] || '').length; },
      list: function () { return Object.keys(files); },
      read: function (n) { return files[n] || ''; },
      remove: function (n) { delete files[n]; },
      export: function (n, d) { return (d || 'usb') + '/' + n; }
    };
  }

  function makeApp(settings) {
    var s = Object.assign({ demo: 'on', source: 'auto', rate: 20, units: 'metric', autostart: false, mapcontrol: false }, settings || {});
    var ctx = {
      _noTimers: true,
      _storage: memStore(),
      internet: true,
      surface: function () { return cv; },
      settings: { get: function (k) { return s[k]; }, onChange: function () {} },
      ui: { onClick: function () {}, image: function () { return null; } },
      log: { info: function () {}, warn: function () {}, error: function () {} }
    };
    var app = new App();
    app.start(ctx);
    return app;
  }

  // Drive N demo ticks with a deterministic clock.
  function drive(app, frames, startMs) {
    var now = startMs || 1700000000000;
    app.engine.clock = function () { return now; };
    for (var i = 0; i < frames; i++) { now += 50; app.tick(now); }
    return now;
  }

  window.renderScreen = function (name) {
    var app, cap = name;
    if (name === 'live') {
      app = makeApp({ style: 'tiles' }); drive(app, 210); app.render(cv, 'live');
      cap = 'LIVE — Tiles style';
    } else if (name === 'live-bars') {
      app = makeApp({ style: 'bars' }); drive(app, 210); app.render(cv, 'live');
      cap = 'LIVE — Bars style';
    } else if (name === 'live-dials') {
      app = makeApp({ style: 'dials' }); drive(app, 210); app.render(cv, 'live');
      cap = 'LIVE — Dials style';
    } else if (name === 'datalog') {
      app = makeApp();
      var now = 1700000000000; app.engine.clock = function () { return now; };
      app._startLog();
      for (var i = 0; i < 140; i++) { now += 50; app.tick(now); if (i === 60) app.marker('pull-1'); }
      app._stopLog();
      app.render(cv, 'datalog');
      cap = 'DATALOG — session saved (DONE state)';
    } else if (name === 'datalog-rec') {
      app = makeApp();
      var n2 = 1700000000000; app.engine.clock = function () { return n2; };
      app._startLog();
      for (var j = 0; j < 90; j++) { n2 += 50; app.tick(n2); }
      app.render(cv, 'datalog');
      cap = 'DATALOG — recording (REC state)';
    } else if (name === 'channels') {
      app = makeApp(); drive(app, 40); app.selection = 10; app.render(cv, 'channels');
      cap = 'CHANNELS — picker (page 1)';
    } else if (name === 'channels-p2') {
      app = makeApp(); drive(app, 40); app.selection = 46; app.render(cv, 'channels');
      cap = 'CHANNELS — per-cylinder PIDs (later page)';
    } else if (name === 'maps') {
      app = makeApp({ mapcontrol: true }); drive(app, 6); app.map.requested = 2; app.render(cv, 'maps');
      cap = 'MAP CONTROL — enabled, stationary';
    } else if (name === 'maps-confirm') {
      app = makeApp({ mapcontrol: true }); drive(app, 6); app.map.requested = 2; app.confirm = true; app.render(cv, 'maps');
      cap = 'MAP CONTROL — confirm overlay';
    } else if (name === 'maps-off') {
      app = makeApp({ mapcontrol: false }); drive(app, 6); app.render(cv, 'maps');
      cap = 'MAP CONTROL — off (safe default)';
    } else if (name === 'mhd') {
      app = makeApp(); drive(app, 6); app.render(cv, 'mhd');
      cap = 'MHD DATALOG (web) link';
    } else if (name === 'connect-locked') {
      app = makeApp(); drive(app, 6); app.render(cv, 'connect');
      cap = 'CONNECT — locked (default: not acknowledged, not enabled)';
    } else if (name === 'connect-enabled') {
      app = makeApp(); drive(app, 6);
      app.enet.acknowledge(); app.enet.setEnabled(true);
      app.render(cv, 'connect');
      cap = 'CONNECT — enabled, no vehicle found yet';
    } else if (name === 'connect-connected') {
      app = makeApp(); drive(app, 6);
      app.enet.acknowledge(); app.enet.setEnabled(true);
      app.enet.setVehicle({ vin: 'WBA00000000000001', host: '169.254.1.1', logicalAddress: 0x1000 });
      app.render(cv, 'connect');
      cap = 'CONNECT — connected (read-only)';
    } else if (name === 'diag') {
      app = makeApp(); drive(app, 6);
      app.enet.acknowledge(); app.enet.setEnabled(true);
      app.enet.setVehicle({ vin: 'WBA00000000000001', host: '169.254.1.1', logicalAddress: 0x1000 });
      app.render(cv, 'diag');
      cap = 'DIAGNOSTICS hub — Connect, Fault Codes, Calibration Flash';
    } else if (name === 'codes') {
      app = makeApp(); drive(app, 6); app.render(cv, 'codes');
      cap = 'FAULT CODES — before a scan';
    } else if (name === 'codes-result') {
      app = makeApp(); drive(app, 6);
      app.codes.result = { scanned: 4, reached: 3, totalDtcs: 4, modules: [
        { module: { name: 'DME / DDE (engine)' }, ok: true, dtcs: [
          { code: 'P0300', status: { confirmed: true } }, { code: 'P052A', status: { confirmed: false } } ] },
        { module: { name: 'EGS (transmission)' }, ok: true, dtcs: [ { code: 'P17BA', status: { confirmed: true } } ] },
        { module: { name: 'DSC (stability / brakes)' }, ok: true, dtcs: [ { code: 'C0501', status: { confirmed: true } } ] },
        { module: { name: 'EPS (steering)' }, ok: false, dtcs: [] }
      ] };
      app.codes.msg = '4 codes across 3/4 modules';
      app.render(cv, 'codes');
      cap = 'FAULT CODES — whole-vehicle scan result';
    } else if (name === 'codes-confirm') {
      app = makeApp(); drive(app, 6);
      app.codes.confirmClear = true;
      app.codes.msg = 'Press Clear again to ERASE fault memory on all reached modules.';
      app.render(cv, 'codes');
      cap = 'FAULT CODES — clear confirmation (erases fault memory)';
    } else {
      app = makeApp(); app.render(cv, 'live');
    }
    document.getElementById('cap').textContent = cap;
    return true;
  };

  window.PREVIEW_READY = true;
  window.renderScreen('live');
})();
</script>
</body>
</html>
