<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeeM-Flash — preview</title>
<style>
  html, body { margin: 0; background: #05080b; color: #cdd; font-family: Arial, sans-serif; }
  #wrap { padding: 16px; }
  canvas { display: block; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); background:#0b0f14; }
  .cap { margin: 10px 2px; font-size: 13px; color: #789; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="1600" height="520"></canvas>
  <div class="cap" id="cap">loading…</div>
</div>

<script src="app.bundle.js"></script>
<script src="cv2d.js"></script>
<script>
(function () {
  var canvas = document.getElementById('screen');
  var cv = window.makeCv2d(canvas, 1600, 520);
  var App = window.__ENTRY.App;

  function memStore() {
    var files = {};
    return {
      open: function (n) { files[n] = ''; return { name: n }; },
      append: function (h, t) { files[h.name] = (files[h.name] || '') + t; },
      close: function () {},
      size: function (h) { return (files[h.name] || '').length; },
      list: function () { return Object.keys(files); },
      read: function (n) { return files[n] || ''; },
      remove: function (n) { delete files[n]; },
      export: function (n, d) { return (d || 'usb') + '/' + n; }
    };
  }

  function makeApp(settings) {
    var s = Object.assign({ demo: 'on', source: 'auto', rate: 20, units: 'metric', autostart: false, mapcontrol: false }, settings || {});
    var ctx = {
      _noTimers: true,
      _storage: memStore(),
      internet: true,
      surface: function () { return cv; },
      settings: { get: function (k) { return s[k]; }, onChange: function () {} },
      ui: { onClick: function () {}, image: function () { return null; } },
      log: { info: function () {}, warn: function () {}, error: function () {} }
    };
    var app = new App();
    app.start(ctx);
    return app;
  }

  // Drive N demo ticks with a deterministic clock.
  function drive(app, frames, startMs) {
    var now = startMs || 1700000000000;
    app.engine.clock = function () { return now; };
    for (var i = 0; i < frames; i++) { now += 50; app.tick(now); }
    return now;
  }

  // Each case sets up an App, selects a tab, and renders one frame.
  function withEnet(app) {
    drive(app, 6);
    app.enet.acknowledge(); app.enet.setEnabled(true);
    app.enet.setVehicle({ vin: 'WBA00000000000001', host: '169.254.1.1', logicalAddress: 0x1000 });
    return app;
  }
  var SAMPLE_CODES = { scanned: 4, reached: 3, totalDtcs: 4, modules: [
    { module: { name: 'DME / DDE (engine)' }, ok: true, dtcs: [ { code: 'P0300', status: { confirmed: true } }, { code: 'P052A', status: { confirmed: false } } ] },
    { module: { name: 'EGS (transmission)' }, ok: true, dtcs: [ { code: 'P17BA', status: { confirmed: true } } ] },
    { module: { name: 'DSC (stability / brakes)' }, ok: true, dtcs: [ { code: 'C0501', status: { confirmed: true } } ] },
    { module: { name: 'EPS (steering)' }, ok: false, dtcs: [] } ] };
  var SAMPLE_DESC = { addressHex: '0xA0010000', size: 65536, security: 'level 0x11 + key', erase: 'routine 0xFF00', verify: 'routine 0xFF01',
    fingerprint: { kind: null, match: false, text: 'not a known stock / MHD+ image' },
    checksum: { ok: false, count: 3, bad: 1, correct: true } };
  var SAMPLE_TUNE = { calId: 'CAL_MHD_STG2', programmingDate: '2023-09-01', detected: 'MHD', modified: true, note: 'Signature match — looks like MHD.' };
  function readInfo(app) { app.info.done = true; app.info.tune = SAMPLE_TUNE; return app; }

  window.renderScreen = function (name) {
    var app, cap = name;
    if (name === 'live') { app = makeApp({ style: 'tiles' }); drive(app, 210); app.tab = 'live'; app.render(cv); cap = 'LIVE — tiles'; }
    else if (name === 'live-bars') { app = makeApp({ style: 'bars' }); drive(app, 210); app.tab = 'live'; app.render(cv); cap = 'LIVE — bars'; }
    else if (name === 'live-dials') { app = makeApp({ style: 'dials' }); drive(app, 210); app.tab = 'live'; app.render(cv); cap = 'LIVE — dials'; }
    else if (name === 'log') {
      app = makeApp(); var now = 1700000000000; app.engine.clock = function () { return now; };
      app._startLog(); for (var i = 0; i < 140; i++) { now += 50; app.tick(now); if (i === 60) app.marker('pull-1'); } app._stopLog();
      app.tab = 'log'; app.render(cv); cap = 'LOG — session saved';
    }
    else if (name === 'log-rec') {
      app = makeApp(); var n2 = 1700000000000; app.engine.clock = function () { return n2; };
      app._startLog(); for (var j = 0; j < 90; j++) { n2 += 50; app.tick(n2); }
      app.tab = 'log'; app.render(cv); cap = 'LOG — recording';
    }
    else if (name === 'channels') { app = makeApp(); drive(app, 40); app.selection = 4; app.tab = 'channels'; app.render(cv); cap = 'CHANNELS'; }
    else if (name === 'maps-off') { app = makeApp({ mapcontrol: 'off' }); drive(app, 6); app.tab = 'maps'; app.render(cv); cap = 'MAPS — off (safe default)'; }
    else if (name === 'maps') { app = makeApp({ mapcontrol: 'armed' }); drive(app, 6); app.map.requested = 2; app.tab = 'maps'; app.render(cv); cap = 'MAPS — armed'; }
    else if (name === 'maps-confirm') { app = makeApp({ mapcontrol: 'armed' }); drive(app, 6); app.map.requested = 2; app.confirm = true; app.tab = 'maps'; app.render(cv); cap = 'MAPS — confirm'; }
    else if (name === 'engine-off') { app = makeApp({ engineconfig: 'off' }); drive(app, 6); app.tab = 'engine'; app.render(cv); cap = 'ENGINE \u2014 off (safe default)'; }
    else if (name === 'engine') { app = makeApp({ engineconfig: 'armed', tuner: 'mhd' }); drive(app, 6); app.tab = 'engine'; app.render(cv); cap = 'ENGINE \u2014 armed (tuner)'; }
    else if (name === 'engine-locked') { app = makeApp({ engineconfig: 'armed', tuner: 'off' }); drive(app, 6); app.tab = 'engine'; app.render(cv); cap = 'ENGINE \u2014 tuner features locked'; }
    else if (name === 'engine-confirm') { app = makeApp({ engineconfig: 'armed', tuner: 'mhd' }); drive(app, 6); app.tab = 'engine'; app.eng.sel = 0; app.eng.pending.flap = 'open'; app.eng.confirm = true; app.render(cv); cap = 'ENGINE \u2014 confirm'; }
    else if (name === 'connect') { app = makeApp(); app.connect = { state: 'ok', detail: 'DME answered \u2014 VIN 5UX83DP04P9S09849', checking: false }; app.tab = 'connect'; app.render(cv); cap = 'CONNECT — head-unit link OK'; }
    else if (name === 'bridge-off') { app = makeApp(); app.tab = 'connect'; app.connectView = 'bridge'; app.render(cv); cap = 'BRIDGE \u2014 off (no daemon)'; }
    else if (name === 'bridge-direct') { app = makeApp(); app.tab = 'connect'; app.connectView = 'bridge';
      app.bgate.acknowledge(); app.bgate.enable(); app.bgate.arm(60000);
      app.bstate = { busy: false, mode: 'direct', msg: 'Bridge on \u2014 connect to 172.16.222.97:13400', ok: true };
      app.bserver.listening = true; app.bserver.boundHost = '172.16.222.97'; app.bserver.port = 13400;
      app.bserver.peers = [{ ip: '172.16.222.54', mac: null }];
      app.bserver.stats = { relayed: 96, refused: 2, lastRefusal: 'ECU 0x40 not in relay allow-list', audit: [] };
      app.render(cv); cap = 'BRIDGE \u2014 direct (no helper needed)'; }
    else if (name === 'bridge-on') { app = makeApp(); app.tab = 'connect'; app.connectView = 'bridge';
      app.bgate.acknowledge(); app.bgate.enable(); app.bgate.arm(60000);
      app.bstate = { busy: false, mode: 'helper', msg: '1 device connected.', ok: true };
      app.bridge.connected = true;
      app.bridge.ap = { up: true, ssid: 'BeeM-Flash', pass: 'kite-9427-mesa', security: 'WPA2', channel: 6, address: '192.168.44.1' };
      app.bridge.stations = [{ ip: '192.168.44.23', mac: 'a4:83:e7:11:22:33' }];
      app.bridge.relayed = 142; app.bridge.refused = 3; app.bridge.lastRefusal = 'ECU 0x40 not in relay allow-list';
      app.render(cv); cap = 'BRIDGE \u2014 helper access point'; }
    else if (name === 'connect-locked') { app = makeApp(); drive(app, 6); app.tab = 'connect'; app.render(cv); cap = 'CONNECT — locked'; }
    else if (name === 'codes') { app = withEnet(makeApp()); app.codes.msg = ''; app.tab = 'codes'; app.render(cv); cap = 'CODES — before scan'; }
    else if (name === 'codes-result') { app = withEnet(makeApp()); app.codes.result = SAMPLE_CODES; app.codes.tune = SAMPLE_TUNE; app.codes.msg = '4 codes across 3/4 modules'; app.tab = 'codes'; app.render(cv); cap = 'CODES — scan result + tune on car'; }
    else if (name === 'codes-confirm') { app = withEnet(makeApp()); app.codes.result = SAMPLE_CODES; app.codes.confirmClear = true; app.codes.msg = 'Press CLEAR again to ERASE fault memory.'; app.tab = 'codes'; app.render(cv); cap = 'CODES — clear confirm'; }
    else if (name === 'flash-blocked') { app = withEnet(makeApp()); app.flash.armed = false; app.tab = 'flash'; app.render(cv); cap = 'FLASH — locked until ECU read (prerequisite)'; }
    else if (name === 'flash-off') { app = readInfo(withEnet(makeApp())); app.flash.armed = false; app.tab = 'flash'; app.render(cv); cap = 'FLASH — engine OFF (ECU read; tune shown)'; }
    else if (name === 'flash-ready') { app = readInfo(withEnet(makeApp())); app.flash.armed = true; app.flash.descriptor = SAMPLE_DESC; app.tab = 'flash'; app.render(cv); cap = 'FLASH — calibration ready'; }
    else if (name === 'flash-confirm') { app = readInfo(withEnet(makeApp())); app.flash.armed = true; app.flash.descriptor = SAMPLE_DESC; app.flash.confirm = true; app.tab = 'flash'; app.render(cv); cap = 'FLASH — confirm write'; }
    else if (name === 'flash-running') { app = readInfo(withEnet(makeApp())); app.flash.armed = true; app.flash.descriptor = SAMPLE_DESC; app.flash.running = true; app.flash.progress = 62; app.flash.step = 'transfer 62%'; app.tab = 'flash'; app.render(cv); cap = 'FLASH — writing'; }
    else if (name === 'log-run') {
      app = makeApp(); var nr = 1700000000000; app.engine.clock = function () { return nr; };
      app._startLog(); for (var ri = 0; ri < 400; ri++) { nr += 50; app.tick(nr); } app._stopLog();
      app.tab = 'log'; app.render(cv); cap = 'LOG — with dyno pull estimate';
    }
    else if (name === 'info') {
      app = withEnet(makeApp());
      app.info.items = [
        { did: 0xF190, label: 'VIN', value: 'WBA12345678901234', ok: true },
        { did: 0xF187, label: 'Part number', value: '8795432', ok: true },
        { did: 0xF191, label: 'Hardware number', value: 'DME_MG1CS003', ok: true },
        { did: 0xF194, label: 'Software number', value: '00008051', ok: true },
        { did: 0xF195, label: 'Software version', value: 'I001-20', ok: true },
        { did: 0xF18C, label: 'ECU serial', value: 'not available', ok: false },
        { did: 0xF18B, label: 'Manufacturing date', value: '2021-04-18', ok: true },
        { did: 0xF17C, label: 'Calibration ID', value: 'CAL_B58_STG2', ok: true }
      ];
      app.info.msg = '8 of 11 identifiers read';
      app.info.tune = SAMPLE_TUNE; app.info.done = true;
      app.info.binVerify = { match: false, kind: null, sha256: '9f2c…' }; // on-car image not stock (map-only tune caught)
      app.tab = 'info'; app.render(cv); cap = 'INFO — ECU identification + tune status (read-only)';
    }
    else if (name === 'setup') { app = makeApp(); drive(app, 6); app.setupSel = 1; app.tab = 'setup'; app.render(cv); cap = 'SETUP — in-app settings'; }
    else if (name === 'setup-diag') {
      app = makeApp(); app.tab = 'setup'; app.setupView = 'diag';
      app.bdiag = { running: false, msg: 'Done', result: {
        net: [ { iface: 'wlan0', ip: '192.168.44.1', mac: 'a4:50:46:aa:bb:cc', internal: false }, { iface: 'socnet0', ip: '160.48.199.115', mac: '02:11:22:33:44:55', internal: false }, { iface: 'lo', ip: '127.0.0.1', mac: '', internal: true } ],
        sockets: [ { path: '/run/beem-probe/p.sock', status: 'ENOENT' }, { path: '/dev/shm/beem-probe/p.sock', status: 'ENOENT' } ],
        tasu: { status: 'ok', vin: 'WBA5R1C09NFK12345', bytes: 20 } } };
      app.render(cv); cap = 'SETUP → DIAGNOSTICS (sample result)';
    }
    else { app = makeApp(); app.tab = 'live'; app.render(cv); }
    document.getElementById('cap').textContent = cap;
    return true;
  };

  window.PREVIEW_READY = true;
  window.renderScreen('live');
})();
</script>
</body>
</html>
